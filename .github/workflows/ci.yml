name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. Both build the FFGL plugin AND the OpenFX transition (BUILD_OFX is on
# by default). There is no Linux job here: Resolume has no Linux build, and
# the Linux OpenFX build and its Rocky 8 load test are release.yml's
# linux-ofx and linux-load, which a dispatch of that workflow runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # LENTICULAR_BUILD_TOOLS is ON here where the release build turns it
        # OFF: lntest is where the two inputs, the flip, the moire and the
        # near viewer's sweep are actually measured, so compiling and running
        # it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DLENTICULAR_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The suites
        # The runner has no GPU, so everything but --names runs on Apple's
        # software renderer. Its interpolated uv is good only to the GL
        # spec's 1 part in 10^5 (wipe's --area failed here on exactly that),
        # so the shader never computes a position from uv except through
        # floor( uv * size ), and tools/verify.sh runs the same suites on the
        # same renderer locally with LNTEST_RENDERER=software: a check that
        # would fail here fails there first.
        run: ctest --test-dir build --output-on-failure

      - name: The OpenFX bundle
        # The release job's checks, here where a pull request sees them: the
        # plist names the binary that is on disk (or codesign fails after the
        # tag, naming a "subcomponent" and never the plist), the bundle
        # exports OfxGetPlugin, and it ad-hoc signs. The per-pixel claim --
        # the CPU twin against the GPU -- is `lntest --cpu`, in the suites.
        run: |
          b=build/Lenticular.ofx.bundle
          exe=$( /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$b/Contents/Info.plist" )
          test -f "$b/Contents/MacOS/$exe"
          __symbols=$( nm -gU "$b/Contents/MacOS/$exe" )
          case "$__symbols" in
            *_OfxGetPlugin*) ;;
            *) echo "expected _OfxGetPlugin"; exit 1 ;;
          esac
          cp -R "$b" "$RUNNER_TEMP/"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/Lenticular.ofx.bundle"

      - name: Controls
        # At 320x180, because the runner has no GPU and the question is only
        # whether a control changed ANY subpixel. Two at a time on a
        # three-core runner; graticule learned that an eight-wide pool at
        # 320x180 was still going at twenty minutes. Eleven controls here
        # against rosette's forty-four, so it should be comfortable.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 320x180 --jobs 2

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem -- and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs.
      - uses: actions/upload-artifact@v7
        with:
          name: lenticular-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DLENTICULAR_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The OpenFX binary is where the bundle layout puts it
        shell: bash
        run: test -f build/Lenticular.ofx.bundle/Contents/Win64/Lenticular.ofx

      - uses: actions/upload-artifact@v7
        with:
          name: lenticular-windows-x86_64
          path: |
            build/Release/*.dll
            build/Lenticular.ofx.bundle/Contents/Win64/*.ofx
          if-no-files-found: error

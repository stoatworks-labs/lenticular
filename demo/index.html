  <body>
    <main id="demo">
      <noscript>
        <h1>Lenticular</h1>
        <p>
          An FFGL mixer that shows this layer or the layer below the way a
          printed lenticular card does: two pictures cut into strips and
          interleaved under a sheet of cylindrical lenses, with the layer's
          opacity fader tilting the card. Each lens focuses the eye onto one
          point of the print, so the card flips square on and flips back at the
          edge of the viewing zone. A real lens's focus spot shows both pictures
          near the flip, a print pitch that misses the lens pitch flips in moiré
          bands that sweep as the card tilts, a close viewer sees the flip
          travel across the card, and each lens shows one stepped sample of its
          picture, with the ridges catching the light.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/lenticular">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/lenticular/">Project page and downloads</a></li>
